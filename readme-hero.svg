<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">GradeCalc — Student learning and grade dashboard</title>
  <desc id="desc">An animated student study desk with a notebook, calculator, graduation cap, SGPA and CGPA cards, and a rising progress chart.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b3c"/><stop offset=".55" stop-color="#182e59"/><stop offset="1" stop-color="#253d71"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c4b5fd"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8efff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#bfdbfe" opacity=".22"/></pattern>
  </defs>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif}
    .float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .float2{animation:float 6s ease-in-out -1.8s infinite;transform-box:fill-box;transform-origin:center}
    .bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .shine{animation:shine 2.8s ease-in-out infinite}
    .draw{stroke-dasharray:180;stroke-dashoffset:180;animation:draw 3s ease-out .4s forwards}
    @keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-11px) rotate(1deg)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
    @keyframes shine{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes draw{to{stroke-dashoffset:0}}
  </style>
  <rect width="1200" height="520" rx="28" fill="url(#background)"/>
  <rect width="1200" height="520" rx="28" fill="url(#dots)"/>
  <circle cx="1000" cy="95" r="220" fill="#818cf8" opacity=".12"/>
  <circle cx="850" cy="430" r="190" fill="#22d3ee" opacity=".09"/>
  <path d="M0 425L330 520H0Z" fill="#67e8f9" opacity=".09"/>
  <rect x="54" y="52" width="7" height="405" rx="4" fill="url(#cyan)"/>
  <text x="86" y="88" fill="#a5f3fc" font-size="14" font-weight="700" letter-spacing="3.2">YOUR STUDY PROGRESS, MADE CLEAR</text>
  <text x="82" y="158" fill="#fff" font-size="58" font-weight="800">GradeCalc</text>
  <text x="86" y="201" fill="#dbeafe" font-size="21">Learn your grades. Plan your next goal.</text>
  <text x="87" y="251" fill="#a5b4fc" font-size="14" font-weight="700" letter-spacing="1.8">SGPA  •  CGPA  •  WHAT-IF PLANNING</text>
  <g transform="translate(87 279)">
    <rect width="119" height="35" rx="17.5" fill="#34d399" fill-opacity=".13" stroke="#6ee7b7" stroke-opacity=".8"/>
    <text x="59.5" y="22" fill="#a7f3d0" text-anchor="middle" font-size="12" font-weight="700">STUDENT FIRST</text>
    <rect x="131" width="134" height="35" rx="17.5" fill="#818cf8" fill-opacity=".16" stroke="#c4b5fd" stroke-opacity=".8"/>
    <text x="198" y="22" fill="#ddd6fe" text-anchor="middle" font-size="12" font-weight="700">INSTANT RESULTS</text>
  </g>
  <text x="87" y="389" fill="#b6c6e8" font-size="14">A simple companion for every semester.</text>
  <text x="87" y="447" fill="#91a7d4" font-size="12" letter-spacing="1.8">BUILT FOR STUDENTS  /  BERNARD VIVIAN</text>

  <!-- Student desk scene -->
  <ellipse cx="894" cy="440" rx="240" ry="28" fill="#070d24" opacity=".48"/>
  <g class="float" filter="url(#shadow)">
    <!-- open notebook -->
    <g transform="translate(734 242) rotate(-8)">
      <path d="M0 30Q64 9 123 30V176Q62 154 0 176Z" fill="url(#paper)" stroke="#c7d2fe" stroke-width="2"/>
      <path d="M123 30Q185 9 246 30V176Q185 154 123 176Z" fill="#f8faff" stroke="#c7d2fe" stroke-width="2"/>
      <path d="M123 30V176" stroke="#a5b4fc" stroke-width="2"/>
      <g stroke="#b8c8e8" stroke-width="2" stroke-linecap="round">
        <path d="M17 53H103M17 72H103M17 91H103M17 110H103M17 129H93M140 53H225M140 72H225M140 91H225M140 110H225M140 129H214"/>
      </g>
      <path d="M17 148L38 138L58 143L78 120L101 112" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="101" cy="112" r="4" fill="#4f46e5"/>
      <rect x="142" y="139" width="75" height="20" rx="6" fill="#dcfce7"/>
      <text x="179" y="153" fill="#047857" font-size="10" text-anchor="middle" font-weight="700">KEEP GOING!</text>
    </g>
  </g>

  <!-- floating grade summary -->
  <g class="float2" filter="url(#shadow)">
    <rect x="895" y="94" width="226" height="126" rx="18" fill="#fff" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="895" y="94" width="226" height="38" rx="18" fill="#eef2ff"/>
    <path d="M895 115V132H1121V115" fill="#eef2ff"/>
    <circle cx="914" cy="113" r="4" fill="#818cf8"/><circle cx="928" cy="113" r="4" fill="#38bdf8"/><circle cx="942" cy="113" r="4" fill="#34d399"/>
    <text x="911" y="153" fill="#64748b" font-size="11" font-weight="700">SEMESTER PERFORMANCE</text>
    <text x="911" y="185" fill="#172554" font-size="28" font-weight="800">SGPA 8.72</text>
    <rect x="911" y="197" width="193" height="7" rx="3.5" fill="#e0e7ff"/>
    <rect x="911" y="197" width="168" height="7" rx="3.5" fill="url(#violet)"/>
  </g>

  <!-- CGPA progress panel -->
  <g class="bob" filter="url(#shadow)">
    <rect x="978" y="260" width="151" height="125" rx="17" fill="#12234a" stroke="#67e8f9" stroke-opacity=".85" stroke-width="1.5"/>
    <text x="994" y="284" fill="#a5f3fc" font-size="11" font-weight="700">CGPA GOAL</text>
    <text x="994" y="311" fill="#fff" font-size="23" font-weight="800">9.0</text>
    <text x="1033" y="310" fill="#9fb2d7" font-size="11">/ 10</text>
    <path d="M994 356V338L1013 328L1031 339L1050 316L1068 323L1088 298L1110 304" fill="none" stroke="#67e8f9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M994 356V338L1013 328L1031 339L1050 316L1068 323L1088 298L1110 304V356Z" fill="#22d3ee" opacity=".12"/>
  </g>

  <!-- graduation cap -->
  <g class="float2" transform="translate(760 105)">
    <path d="M0 24L62 0L124 24L62 49Z" fill="#818cf8" stroke="#c4b5fd" stroke-width="1.5"/>
    <path d="M24 34V54Q62 78 100 54V34L62 49Z" fill="#4f46e5"/>
    <path d="M124 24V54" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <circle cx="124" cy="57" r="4" fill="#fbbf24"/>
  </g>
  <g fill="none" stroke="url(#cyan)" stroke-width="2" stroke-linecap="round">
    <path class="draw" d="M700 190C664 156 694 128 723 145S756 159 773 143"/>
    <path class="draw" d="M1080 407C1130 423 1150 390 1125 369"/>
  </g>
  <g class="shine" fill="#a5f3fc"><circle cx="700" cy="190" r="4"/><circle cx="1125" cy="369" r="4"/><path d="M1144 228l4 10 10 4-10 4-4 10-4-10-10-4 10-4Z"/></g>
  <g class="shine" fill="#c4b5fd"><path d="M705 94l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/><circle cx="1150" cy="156" r="3"/></g>
</svg>