<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">GradeCalc animated dimensional project artwork</title><desc id="d">Layered isometric student grade calculator with animated glowing grade tiles, light trails and floating depth panels.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111b"/><stop offset="1" stop-color="#102f3b"/></linearGradient><linearGradient id="mint"><stop stop-color="#6ee7b7"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1c4856"/><stop offset="1" stop-color="#0b202e"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="shadow"><feGaussianBlur stdDeviation="15"/></filter><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#67e8f9" stroke-opacity=".1"/></pattern></defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.float2{animation:float2 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 2.8s ease-in-out infinite}.dash{stroke-dasharray:12 16;animation:dash 7s linear infinite}.orbit{animation:spin 14s linear infinite;transform-origin:900px 250px}@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-13px) rotate(1deg)}}@keyframes float2{0%,100%{transform:translateY(0)}50%{transform:translateY(9px)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes dash{to{stroke-dashoffset:-224}}@keyframes spin{to{transform:rotate(360deg)}}</style><rect width="1200" height="520" rx="28" fill="url(#bg)"/><rect width="1200" height="520" rx="28" fill="url(#grid)"/><circle cx="1000" cy="100" r="230" fill="#34d399" opacity=".1"/><circle cx="900" cy="360" r="240" fill="#22d3ee" opacity=".08"/><path d="M0 420L390 520H0Z" fill="#34d399" opacity=".12"/><path d="M690 0H1200V130Z" fill="#22d3ee" opacity=".07"/><rect x="56" y="52" width="7" height="408" rx="4" fill="url(#mint)"/><text x="88" y="91" fill="#6ee7b7" font-size="15" font-weight="700" letter-spacing="4">STUDENT PERFORMANCE WORKSPACE</text><text x="86" y="164" fill="#f8fafc" font-size="56" font-weight="800">GradeCalc</text><text x="89" y="207" fill="#c5e4e8" font-size="21">Calculate. Understand. Improve.</text><text x="89" y="257" fill="#89aeb9" font-size="15">SGPA / CGPA / GRADE CONVERSION</text><g transform="translate(88 286)"><rect width="122" height="36" rx="18" fill="#34d399" fill-opacity=".12" stroke="#6ee7b7" stroke-opacity=".8"/><text x="61" y="23" fill="#a7f3d0" text-anchor="middle" font-size="12" font-weight="700">LIVE PWA</text><rect x="135" width="140" height="36" rx="18" fill="#22d3ee" fill-opacity=".1" stroke="#67e8f9" stroke-opacity=".65"/><text x="205" y="23" fill="#a5f3fc" text-anchor="middle" font-size="12" font-weight="700">OFFLINE SHELL</text></g><text x="89" y="390" fill="#718e9c" font-size="13" letter-spacing="2">BUILT FOR EVERYDAY STUDENT NEEDS</text><text x="89" y="443" fill="#9bb9c3" font-size="13">BERNARD VIVIAN  /  PROJECT PORTFOLIO</text><ellipse cx="900" cy="432" rx="230" ry="32" fill="#000" opacity=".55" filter="url(#shadow)"/><g class="orbit" fill="none" stroke="#67e8f9" stroke-opacity=".35"><ellipse cx="900" cy="250" rx="225" ry="78" stroke-dasharray="3 14"/><ellipse cx="900" cy="250" rx="190" ry="112" stroke-dasharray="2 18"/></g><g class="float"><path d="M704 164L906 86L1110 165L908 247Z" fill="#245261" stroke="#6ee7b7" stroke-opacity=".8"/><path d="M704 164L908 247V413L704 330Z" fill="#123744" stroke="#285e6b"/><path d="M908 247L1110 165V330L908 413Z" fill="#0b2634" stroke="#285e6b"/><g transform="translate(770 174) skewY(-19)"><rect width="280" height="174" rx="13" fill="url(#glass)" stroke="#6ee7b7" stroke-width="2"/><rect x="13" y="13" width="254" height="43" rx="8" fill="#16414b"/><text x="28" y="31" fill="#9fbfc7" font-size="10">CURRENT SEMESTER</text><text x="28" y="48" fill="#a7f3d0" font-size="19" font-weight="800">SGPA  8.72</text><rect x="14" y="68" width="252" height="90" rx="8" fill="#0b2532"/><g class="pulse" filter="url(#glow)"><rect x="26" y="81" width="43" height="24" rx="5" fill="#34d399"/><rect x="78" y="81" width="43" height="24" rx="5" fill="#246273"/><rect x="130" y="81" width="43" height="24" rx="5" fill="#246273"/><rect x="182" y="81" width="43" height="24" rx="5" fill="#246273"/><rect x="26" y="116" width="43" height="24" rx="5" fill="#246273"/><rect x="78" y="116" width="43" height="24" rx="5" fill="#246273"/><rect x="130" y="116" width="43" height="24" rx="5" fill="#34d399"/><rect x="182" y="116" width="43" height="24" rx="5" fill="#246273"/></g></g></g><g class="float2"><rect x="1010" y="106" width="116" height="66" rx="12" fill="#102f3d" stroke="#67e8f9"/><text x="1068" y="132" fill="#a5f3fc" font-size="10" text-anchor="middle">GRADE POINTS</text><text x="1068" y="155" fill="#f0fdfa" font-size="20" font-weight="800" text-anchor="middle">+10</text></g><g fill="none" stroke="url(#mint)" stroke-width="2" filter="url(#glow)"><path class="dash" d="M680 190C625 135 670 95 720 118S780 135 803 112"/><path class="dash" d="M1020 360C1100 390 1145 340 1120 298"/></g><circle class="pulse" cx="720" cy="118" r="5" fill="#6ee7b7"/><circle class="pulse" cx="1120" cy="298" r="5" fill="#67e8f9"/></svg>