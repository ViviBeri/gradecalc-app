<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">GradeCalc project banner</title><desc id="desc">Animated 3D-inspired project banner for GradeCalc.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080f1c"/><stop offset="1" stop-color="#15283a"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#38bdf8"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter></defs>
<style>.float{transform-origin:900px 245px;animation:float 5s ease-in-out infinite}.glow{animation:pulse 4s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0px) rotate(-1deg)}50%{transform:translateY(-12px) rotate(1deg)}}@keyframes pulse{0%,100%{opacity:.12}50%{opacity:.26}}text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="1200" height="480" rx="28" fill="url(#bg)"/><circle class="glow" cx="1020" cy="75" r="220" fill="#34d399" opacity=".16"/><circle class="glow" cx="1120" cy="450" r="180" fill="#38bdf8" opacity=".14"/><path d="M0 410 L420 480 L0 480 Z" fill="#34d399" opacity=".05"/><rect x="52" y="50" width="8" height="380" rx="4" fill="url(#accent)"/>
<text x="88" y="105" fill="#34d399" font-size="18" font-weight="700" letter-spacing="4">STUDENT TOOL · LIVE PWA</text><text x="88" y="185" fill="#f8fafc" font-size="54" font-weight="700">GradeCalc</text><text x="90" y="230" fill="#b9c8d8" font-size="22">Calculate. Understand. Improve.</text><text x="90" y="300" fill="#71869b" font-size="15" letter-spacing="2">BUILT FOR REAL-WORLD WORKFLOWS</text><rect x="88" y="330" width="190" height="4" rx="2" fill="url(#accent)"/><text x="88" y="385" fill="#93a7bb" font-size="15">BERNARD VIVIAN  /  PROJECT PORTFOLIO</text><ellipse cx="900" cy="415" rx="205" ry="24" fill="#000" opacity=".35" filter="url(#shadow)"/><g><g class="float"><path d="M730 150 L920 80 L1080 150 L890 225 Z" fill="#1b4352" stroke="#34d399" stroke-opacity=".8"/><path d="M730 150 L890 225 L890 430 L730 350 Z" fill="#123342"/><path d="M890 225 L1080 150 L1080 355 L890 430 Z" fill="#0f2636"/><path d="M770 175 L890 128 L1030 183 L910 230 Z" fill="#10212e" stroke="#476779"/><g transform="translate(812 184) skewY(-20)"><rect width="178" height="162" rx="12" fill="#102b3a" stroke="#34d399" stroke-width="2"/><rect x="18" y="16" width="142" height="34" rx="7" fill="#174a4c"/><text x="30" y="38" fill="#a7f3d0" font-size="15">SGPA  8.72</text><rect x="18" y="65" width="39" height="21" rx="5" fill="#34d399" opacity=".95"/><rect x="67" y="65" width="39" height="21" rx="5" fill="#284759" opacity=".9"/><rect x="116" y="65" width="39" height="21" rx="5" fill="#284759" opacity=".9"/><rect x="18" y="94" width="39" height="21" rx="5" fill="#284759" opacity=".9"/><rect x="67" y="94" width="39" height="21" rx="5" fill="#284759" opacity=".9"/><rect x="116" y="94" width="39" height="21" rx="5" fill="#284759" opacity=".9"/><rect x="18" y="123" width="39" height="21" rx="5" fill="#284759" opacity=".9"/><rect x="67" y="123" width="39" height="21" rx="5" fill="#284759" opacity=".9"/><rect x="116" y="123" width="39" height="21" rx="5" fill="#284759" opacity=".9"/></g></g></g>
</svg>