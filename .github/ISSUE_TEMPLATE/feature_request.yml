name: Feature request
description: Suggest an improvement or new GradeCalc feature
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve GradeCalc. Please avoid including personal or student data."
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the student task or difficulty.
      placeholder: "I find it difficult to..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      placeholder: "A feature that..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
    validations:
      required: false
