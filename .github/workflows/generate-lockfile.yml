name: Generate GradeCalc npm lockfile

on:
  push:
    branches:
      - security/harden-android-dependencies
    paths:
      - "package.json"
      - ".github/workflows/generate-lockfile.yml"

permissions:
  contents: write

concurrency:
  group: gradecalc-lockfile-generation
  cancel-in-progress: false

jobs:
  generate-lockfile:
    name: Generate and commit npm lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: security/harden-android-dependencies
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate lockfile consistency
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "Add generated npm lockfile"
          git push origin HEAD:security/harden-android-dependencies
