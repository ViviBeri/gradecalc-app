name: Dependabot metadata

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  metadata:
    name: Read Dependabot update metadata
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Metadata from Dependabot PRs
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Add metadata to the workflow summary
        env:
          DEPENDENCY_NAMES: ${{ steps.dependabot-metadata.outputs.dependency-names }}
          DEPENDENCY_TYPE: ${{ steps.dependabot-metadata.outputs.dependency-type }}
          UPDATE_TYPE: ${{ steps.dependabot-metadata.outputs.update-type }}
        run: |
          {
            echo "## Dependabot update metadata"
            echo
            echo "- **Dependencies:** ${DEPENDENCY_NAMES:-Not reported}"
            echo "- **Dependency type:** ${DEPENDENCY_TYPE:-Not reported}"
            echo "- **Update type:** ${UPDATE_TYPE:-Not reported}"
          } >> "$GITHUB_STEP_SUMMARY"
