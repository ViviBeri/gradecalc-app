name: GradeCalc calculation tests

on:
  push:
    branches: [main, "test/**"]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: SGPA and CGPA unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run calculation tests
        run: node --test tests/*.test.cjs
