name: Build GradeCalc Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "calc.js"
      - "analytics.js"
      - "js/**"
      - "icons/**"
      - "gradecalc-icon.svg"
      - "manifest.json"
      - "sw.js"
      - "offline.html"
      - "capacitor.config.json"
      - "android-native/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: gradecalc-android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare web assets
        run: |
          mkdir -p www
          rsync -a ./ www/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='android/' \
            --exclude='node_modules/' \
            --exclude='www/' \
            --exclude='python/' \
            --exclude='tests/' \
            --exclude='docs/' \
            --exclude='android-native/' \
            --exclude='worker/' \
            --exclude='functions/' \
            --exclude='screenshots/' \
            --exclude='README.md' \
            --exclude='CONTRIBUTING.md' \
            --exclude='LICENSE' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='capacitor.config.json'

      - name: Install locked Capacitor dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build the required Sharp native binary
        run: npm rebuild sharp --foreground-scripts --no-audit --no-fund

      - name: Generate Android project
        run: ./node_modules/.bin/cap add android

      - name: Install native device-sharing service
        run: |
          mkdir -p android/app/src/main/java/com/viviberi/gradecalc
          cp android-native/*.java android/app/src/main/java/com/viviberi/gradecalc/
          python - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
          ]
          for permission in permissions:
              if permission not in source:
                  source = source.replace("<application", permission + "\n    <application", 1)
          service = '<service android:name=".GradeCalcMonitorService" android:exported="false" android:foregroundServiceType="dataSync" />'
          if service not in source:
              source = source.replace("</application>", "    " + service + "\n</application>")
          manifest.write_text(source)
          gradle = Path("android/app/build.gradle")
          build = gradle.read_text()
          dependency = "implementation 'androidx.core:core:1.15.0'"
          if dependency not in build:
              build = build.replace("dependencies {", "dependencies {\n    " + dependency, 1)
          gradle.write_text(build)
          PY

      - name: Add Maven Central fallback mirror
        working-directory: android
        run: |
          python - <<'PY'
          from pathlib import Path
          mirror = 'maven { url = uri("https://repo1.maven.org/maven2") }'
          for filename in ["settings.gradle", "build.gradle"]:
              path = Path(filename)
              if path.exists():
                  content = path.read_text()
                  if mirror not in content:
                      content = content.replace("repositories {", "repositories {" + chr(10) + "        " + mirror, 1)
                      path.write_text(content)
          PY

      - name: Generate GradeCalc Android launcher icons
        run: |
          mkdir -p assets
          cp gradecalc-icon.svg assets/logo.svg
          ./node_modules/.bin/capacitor-assets generate --android --iconBackgroundColor '#071D58' --splashBackgroundColor '#071D58'

      - name: Add native GradeCalc PNG file bridge
        run: |
          mkdir -p android/app/src/main/java/com/viviberi/gradecalc
          cat > android/app/src/main/java/com/viviberi/gradecalc/GradeCalcFilesPlugin.java <<'JAVA'
          package com.viviberi.gradecalc;

          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.MediaStore;
          import android.util.Base64;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "GradeCalcFiles")
          public class GradeCalcFilesPlugin extends Plugin {
              private Uri writePng(PluginCall call) throws Exception {
                  String dataUrl = call.getString("dataUrl");
                  String fileName = call.getString("fileName", "gradecalc-result.png");
                  if (dataUrl == null || !dataUrl.startsWith("data:image/png;base64,")) {
                      throw new IllegalArgumentException("Invalid PNG data.");
                  }
                  byte[] bytes = Base64.decode(dataUrl.substring(dataUrl.indexOf(",") + 1), Base64.DEFAULT);
                  ContentValues values = new ContentValues();
                  values.put(MediaStore.Images.Media.DISPLAY_NAME, fileName);
                  values.put(MediaStore.Images.Media.MIME_TYPE, "image/png");
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      values.put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/GradeCalc");
                      values.put(MediaStore.Images.Media.IS_PENDING, 1);
                  }
                  Uri collection = MediaStore.Images.Media.EXTERNAL_CONTENT_URI;
                  Uri uri = getContext().getContentResolver().insert(collection, values);
                  if (uri == null) throw new IllegalStateException("Android could not create the image file.");
                  try (OutputStream output = getContext().getContentResolver().openOutputStream(uri)) {
                      if (output == null) throw new IllegalStateException("Could not open image destination.");
                      output.write(bytes);
                      output.flush();
                  } catch (Exception error) {
                      getContext().getContentResolver().delete(uri, null, null);
                      throw error;
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      ContentValues ready = new ContentValues();
                      ready.put(MediaStore.Images.Media.IS_PENDING, 0);
                      getContext().getContentResolver().update(uri, ready, null, null);
                  }
                  return uri;
              }

              @PluginMethod
              public void savePng(PluginCall call) {
                  try {
                      Uri uri = writePng(call);
                      JSObject result = new JSObject();
                      result.put("uri", uri.toString());
                      call.resolve(result);
                  } catch (Exception error) {
                      call.reject("Could not save PNG: " + error.getMessage(), error);
                  }
              }

              @PluginMethod
              public void sharePng(PluginCall call) {
                  try {
                      Uri uri = writePng(call);
                      Intent send = new Intent(Intent.ACTION_SEND);
                      send.setType("image/png");
                      send.putExtra(Intent.EXTRA_STREAM, uri);
                      send.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      getActivity().startActivity(Intent.createChooser(send, "Share GradeCalc result"));
                      call.resolve();
                  } catch (Exception error) {
                      call.reject("Could not share PNG: " + error.getMessage(), error);
                  }
              }
          }
          JAVA
          python - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/java/com/viviberi/gradecalc/MainActivity.java")
          source = path.read_text()
          source = source.replace("import com.getcapacitor.BridgeActivity;", "import com.getcapacitor.BridgeActivity;\nimport com.viviberi.gradecalc.GradeCalcFilesPlugin;\nimport com.viviberi.gradecalc.GradeCalcMonitorPlugin;")
          source = source.replace("public class MainActivity extends BridgeActivity {", "public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(GradeCalcFilesPlugin.class);\n        registerPlugin(GradeCalcMonitorPlugin.class);\n        super.onCreate(savedInstanceState);\n    }")
          path.write_text(source)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: GradeCalc-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
