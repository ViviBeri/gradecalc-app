name: Python calculation tests

on:
  push:
    branches:
      - main
      - feature/python-calculation-engine
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python 3.11 unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run calculation tests
        working-directory: python
        run: python -m unittest -v test_gradecalc.py
