name: Calculation tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check analytics.js
      - run: node --check js/arrears.js
      - run: node tests.js
      - run: node --test tests/*.test.cjs
