name: Calculation tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node --check analytics.js
      - run: node --check js/arrears.js
      - run: node --check js/device.js
      - run: node --check js/media.js
      - run: node --check functions/index.js
      - run: node --check functions/src/callable-factory.cjs
      - name: Install callable backend dependencies
        run: npm install --prefix functions --no-package-lock
      - run: node --check functions/src/pairing-core.cjs
      - name: Install temporary Firestore emulator test dependencies
        run: npm install --no-save --package-lock=false firebase-tools @firebase/rules-unit-testing firebase
      - run: node tests.js
      - run: node --test tests/*.test.cjs
      - name: Test Firestore security rules in emulator
        run: npx firebase emulators:exec --only firestore --project demo-gradecalc "env FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 node --test tests/firestore-emulator.test.cjs tests/device-monitor-admin-emulator.test.cjs"
