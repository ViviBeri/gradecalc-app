name: Calculation tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node --check analytics.js
      - run: node --check js/arrears.js
      - run: node --check js/device.js
      - run: node --check js/device-api-client.js
      - run: node --check js/monitor-dashboard.js
      - run: node --check js/media.js
      - run: node --check functions/index.js
      - run: node --check functions/src/callable-factory.cjs
      - name: Install callable backend dependencies
        run: npm install --prefix functions --no-package-lock
      - run: node --check functions/src/pairing-core.cjs
      - run: node --check worker/src/index.mjs
      - name: Install temporary Firestore emulator test dependencies
        run: npm install --prefix /tmp/firestore-test-deps --no-package-lock firebase-tools @firebase/rules-unit-testing firebase
      - run: node tests.js
      - name: Run Node test suites
        run: NODE_PATH=functions/node_modules:/tmp/firestore-test-deps/node_modules node --test tests/*.test.cjs
      - name: Test Firestore security rules in emulator
        run: /tmp/firestore-test-deps/node_modules/.bin/firebase emulators:exec --only firestore --project demo-gradecalc "env NODE_PATH=functions/node_modules:/tmp/firestore-test-deps/node_modules FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 node --test tests/firestore-emulator.test.cjs"
