<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">GradeCalc G logo</title>
<desc id="desc">A large, clearly visible white and blue G with a graduation cap, gold tassel, a compact calculator at the lower right, and a green orbit swoosh on a deep navy rounded background.</desc>
<defs>
 <linearGradient id="gFace" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".42" stop-color="#D8F2FF"/><stop offset=".78" stop-color="#58BFFF"/><stop offset="1" stop-color="#1474E8"/></linearGradient>
 <linearGradient id="gSide" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#147BFF"/><stop offset="1" stop-color="#063AAB"/></linearGradient>
 <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#35E8FF"/><stop offset=".48" stop-color="#087DF4"/><stop offset="1" stop-color="#2724D8"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D7FF36"/><stop offset=".45" stop-color="#21E94D"/><stop offset="1" stop-color="#00CFAE"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF27A"/><stop offset=".5" stop-color="#FFC400"/><stop offset="1" stop-color="#FF8A00"/></linearGradient>
 <linearGradient id="calc" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EAFBFF"/><stop offset=".4" stop-color="#58C9FF"/><stop offset="1" stop-color="#1261C8"/></linearGradient>
 <linearGradient id="key" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#65B8FF"/><stop offset="1" stop-color="#123C83"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<!-- deep navy app tile background -->
<rect width="512" height="512" rx="76" fill="#061B55"/>
<rect x="3" y="3" width="506" height="506" rx="73" fill="none" stroke="#087DF4" stroke-opacity=".42" stroke-width="5"/>
<!-- green motion swoosh -->
<path d="M103 335C56 386 76 455 168 477c87 21 214 1 291-55-64 83-198 116-305 83C42 473 13 387 103 335Z" fill="url(#green)"/>
<path d="M91 349C52 407 103 461 180 476" fill="none" stroke="#B8FF68" stroke-width="5" stroke-linecap="round" opacity=".8"/>
<!-- dimensional G -->
<path d="M365 205c-28-29-65-45-113-45-99 0-166 72-166 174 0 104 68 173 168 173 48 0 88-15 119-46l-31-34c-22 20-49 30-82 30-67 0-111-48-111-123 0-74 43-122 108-122 31 0 56 9 76 27z" fill="#041C54" opacity=".48" filter="url(#shadow)" transform="translate(8 12)"/>
<path d="M365 205c-28-29-65-45-113-45-99 0-166 72-166 174 0 104 68 173 168 173 48 0 88-15 119-46l-31-34c-22 20-49 30-82 30-67 0-111-48-111-123 0-74 43-122 108-122 31 0 56 9 76 27z" fill="url(#gSide)" transform="translate(0 10)"/>
<path d="M355 191c-28-29-65-45-113-45-99 0-166 72-166 174 0 104 68 173 168 173 48 0 88-15 119-46l-31-34c-22 20-49 30-82 30-67 0-111-48-111-123 0-74 43-122 108-122 31 0 56 9 76 27z" fill="url(#gFace)" stroke="#C7F0FF" stroke-width="3" stroke-linejoin="round"/>
<path d="M286 312h139v49H335c-9 44-41 76-91 87 27 16 58 24 93 24 48 0 88-15 119-46l-31-34c-22 20-49 30-82 30-19 0-36-4-51-11z" fill="url(#gSide)" opacity=".98"/>
<path d="M286 300h139v49H335c-9 44-41 76-91 87 27 16 58 24 93 24 48 0 88-15 119-46l-31-34c-22 20-49 30-82 30-19 0-36-4-51-11z" fill="url(#gFace)" stroke="#B8E9FF" stroke-width="2" stroke-linejoin="round"/>
<!-- graduation cap -->
<path d="M108 122 253 55 407 119 258 190Z" fill="url(#cap)" stroke="#6DEBFF" stroke-width="5" stroke-linejoin="round"/>
<path d="M153 144v47c57 39 145 39 202 0v-47l-97 45z" fill="#1045B7" stroke="#0879E9" stroke-width="4"/>
<path d="M253 68 367 116v65" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
<circle cx="367" cy="185" r="11" fill="#FFD52A"/><path d="M356 194h22l12 51-23 13-23-13z" fill="url(#gold)"/>
<!-- calculator -->
<g transform="translate(160 145) scale(.55)">
 <rect x="300" y="294" width="174" height="178" rx="28" fill="#041A49" opacity=".45" transform="translate(5 7)"/>
 <rect x="294" y="286" width="174" height="178" rx="28" fill="url(#calc)" stroke="#DDF8FF" stroke-width="6"/>
 <rect x="309" y="301" width="144" height="148" rx="19" fill="#061B42" stroke="#278FEA" stroke-width="3"/>
