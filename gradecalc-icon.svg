<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">GradeCalc symbol</title><desc id="desc">Graduation cap, SGPA and CGPA calculator, and A-plus grade sheet. No wordmark.</desc>
