<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A0F1E">
  <title>You're offline · GradeCalc</title>
  <style>
    :root{color-scheme:dark;--bg:#0A0F1E;--surface:#111827;--border:#1F2D45;--text:#F1F5F9;--muted:#94A3B8;--accent:#60A5FA}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,440px);padding:28px;border:1px solid var(--border);border-radius:20px;background:var(--surface);text-align:center}
    .icon{font-size:42px;margin-bottom:8px}
    h1{font-size:1.6rem;line-height:1.2;margin:0 0 12px}
    p{color:var(--muted);margin:0 0 20px}
    button{border:0;border-radius:10px;padding:12px 18px;background:var(--accent);color:#0A0F1E;font-weight:700;font-size:1rem;cursor:pointer}
    button:focus-visible{outline:3px solid white;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">📴</div>
    <h1>You're offline</h1>
    <p>GradeCalc couldn't open this page because there's no internet connection. If you've opened GradeCalc before, return to the app to use its saved offline version.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
