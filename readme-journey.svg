<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="t d">
<title id="t">GradeCalc academic calculation journey</title><desc id="d">Animated five-step illustration of entering subject marks and credits, applying grade boundaries, calculating credit-weighted SGPA, reviewing semester CGPA, and exploring analytics and exports.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1634"/><stop offset="1" stop-color="#253d71"/></linearGradient><linearGradient id="path" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67e8f9"/><stop offset=".55" stop-color="#818cf8"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.flow{stroke-dasharray:13 11;animation:dash 13s linear infinite}.step{transform-box:fill-box;transform-origin:center;animation:lift 5s ease-in-out infinite}.step:nth-of-type(2){animation-delay:.5s}.step:nth-of-type(3){animation-delay:1s}.step:nth-of-type(4){animation-delay:1.5s}.step:nth-of-type(5){animation-delay:2s}.halo{animation:glow 3s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-240}}@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes glow{0%,100%{opacity:.3}50%{opacity:.8}}@media(prefers-reduced-motion:reduce){.flow,.step,.halo{animation:none}}</style>
<rect width="1400" height="420" rx="28" fill="url(#bg)"/><path d="M0 330Q340 210 700 330T1400 280V420H0Z" fill="#60a5fa" opacity=".045"/>
<text x="58" y="58" fill="#f4f7ff" font-size="27" font-weight="750" letter-spacing="2">FROM MARKS TO MEANINGFUL INSIGHT</text><text x="58" y="88" fill="#b5c8e8" font-size="16">GradeCalc · transparent calculations · student-controlled data</text>
<path d="M140 210H1260" stroke="#435b88" stroke-width="7" stroke-linecap="round"/><path class="flow" d="M140 210H1260" stroke="url(#path)" stroke-width="3" fill="none" filter="url(#glow)"/>
<g class="step" transform="translate(140 210)"><circle r="42" fill="#123c5b" stroke="#67e8f9" stroke-width="2"/><circle class="halo" r="32" fill="none" stroke="#67e8f9" stroke-width="2"/><path d="M-15-18H15V18H-15ZM-8-8H8M-8 0H8M-8 8H2" fill="none" stroke="#e0fbff" stroke-width="3" stroke-linecap="round"/><text x="0" y="76" text-anchor="middle" fill="#f0fbff" font-size="17" font-weight="700">ENTER</text><text x="0" y="100" text-anchor="middle" fill="#b5c8e8" font-size="13">Marks + credits</text></g>
<g class="step" transform="translate(420 210)"><circle r="42" fill="#1c3561" stroke="#7dd3fc" stroke-width="2"/><circle class="halo" r="32" fill="none" stroke="#7dd3fc" stroke-width="2"/><path d="M-18 12L-8-2L0 5L15-15" fill="none" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="76" text-anchor="middle" fill="#f0fbff" font-size="17" font-weight="700">GRADE</text><text x="0" y="100" text-anchor="middle" fill="#b5c8e8" font-size="13">Apply SGC scale</text></g>
<g class="step" transform="translate(700 210)"><circle r="42" fill="#2a3265" stroke="#a5b4fc" stroke-width="2"/><circle class="halo" r="32" fill="none" stroke="#a5b4fc" stroke-width="2"/><text x="0" y="8" text-anchor="middle" fill="#f1f2ff" font-size="22" font-weight="800">Σ</text><text x="0" y="76" text-anchor="middle" fill="#f0fbff" font-size="17" font-weight="700">CALCULATE</text><text x="0" y="100" text-anchor="middle" fill="#b5c8e8" font-size="13">Credit-weighted SGPA</text></g>
<g class="step" transform="translate(980 210)"><circle r="42" fill="#352d69" stroke="#c4b5fd" stroke-width="2"/><circle class="halo" r="32" fill="none" stroke="#c4b5fd" stroke-width="2"/><path d="M-17 15V-5H-7V15M-2 15V-16H8V15M13 15V-1H23V15" fill="none" stroke="#ede9fe" stroke-width="3"/><text x="0" y="76" text-anchor="middle" fill="#f0fbff" font-size="17" font-weight="700">TRACK</text><text x="0" y="100" text-anchor="middle" fill="#b5c8e8" font-size="13">Semester CGPA</text></g>
<g class="step" transform="translate(1260 210)"><circle r="42" fill="#17445a" stroke="#67e8f9" stroke-width="2"/><circle class="halo" r="32" fill="none" stroke="#67e8f9" stroke-width="2"/><path d="M-17-14H17V14H-17ZM-9 6L-2-2L4 2L11-8" fill="none" stroke="#e0fbff" stroke-width="3" stroke-linejoin="round"/><text x="0" y="76" text-anchor="middle" fill="#f0fbff" font-size="17" font-weight="700">EXPLORE</text><text x="0" y="100" text-anchor="middle" fill="#b5c8e8" font-size="13">Analytics + export</text></g>
<text x="58" y="380" fill="#9db6dc" font-size="13">IMPORTANT: CURRENT CGPA MODE IS AN UNWEIGHTED AVERAGE OF ENTERED SEMESTER SGPAs.</text></svg>